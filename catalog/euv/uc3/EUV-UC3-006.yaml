schema_version: 1

id: EUV-UC3-006
name: Validar la identidad del inversionista durante la firma

kind: euv
status: automated

environment:
  allowed:
    - dev
  default: dev

use_case:
  id: UC3
  name: Adquirir CDT

objective: >
  Validar que la ceremonia exige y procesa las evidencias de identidad
  requeridas antes de permitir que el inversionista registre su firma.

scenario:
  given:
    - Existe una ceremonia de firma vigente.
    - La ceremonia se encuentra en la etapa de validación de identidad.
    - Existe una fixture facial privada disponible para la prueba.
  when:
    - Se registra la cara frontal del documento de identidad.
    - Se registra la cara posterior del documento de identidad.
    - Se registra la evidencia facial del inversionista.
  then:
    - La cara frontal queda cargada y validada.
    - La cara posterior queda cargada y validada.
    - La evidencia facial queda cargada y validada.
    - La ceremonia avanza a la etapa de firma manuscrita.

risk:
  level: critical
  description: >
    Evitar que una persona avance a la firma sin superar las validaciones
    de identidad definidas para la ceremonia.

coverage:
  count_as_scenario: true

automation:
  framework: playwright
  project: portal
  spec: tests/euv/uc3/EUV-UC3-006.portal.spec.ts

preconditions:
  - PRE-DEV-AUTH-001
  - EUV-UC3-005
  - SIGNATURES_TEST_FACE_PATH

testability_contract:
  - signing-ceremony
  - signing-screen-review
  - signing-e2e-hook
  - id-front
  - id-back
  - face
  - signature

evidence:
  - execution-result
  - duration
  - screenshot
  - screenshot-on-failure
  - video-on-failure
  - trace-on-failure
  - json-state

