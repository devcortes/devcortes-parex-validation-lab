schema_version: 1

id: EUV-UC3-007
name: Registrar la firma manuscrita del inversionista

kind: euv
status: automated

environment:
  allowed:
    - dev
  default: dev

use_case:
  id: UC3
  name: Adquirir CDT

objective: >
  Validar que después de verificar su identidad el inversionista puede
  registrar la representación manuscrita de su firma y continuar hacia
  el consentimiento.

scenario:
  given:
    - Existe una ceremonia de firma vigente.
    - Las evidencias de identidad fueron validadas.
    - La ceremonia se encuentra en la etapa de firma manuscrita.
  when:
    - El inversionista registra su firma manuscrita.
    - El inversionista solicita continuar.
  then:
    - La evidencia gráfica de la firma queda registrada.
    - La ceremonia abandona la etapa de firma manuscrita.
    - La ceremonia avanza a consentimiento.

risk:
  level: critical
  description: >
    Evitar que una ceremonia avance sin registrar la evidencia gráfica
    de firma asociada a la voluntad del inversionista.

coverage:
  count_as_scenario: true

automation:
  framework: playwright
  project: portal
  spec: tests/euv/uc3/EUV-UC3-007.portal.spec.ts

preconditions:
  - PRE-DEV-AUTH-001
  - EUV-UC3-006
  - SIGNATURES_TEST_FACE_PATH

testability_contract:
  - signing-e2e-hook
  - signature
  - consent

evidence:
  - execution-result
  - duration
  - screenshot
  - screenshot-on-failure
  - video-on-failure
  - trace-on-failure
  - json-state

tags:
  - uc3
  - signing
  - handwritten-signature
  - evidence

suites:
  - regression
  - critical
  - signing

architecture:
  - signing-spa
  - signatures-api
  - s3-evidence

sequence: 7